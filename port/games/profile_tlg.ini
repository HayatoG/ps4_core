# The Last Guardian (CUSA03627 v1.03): game profile, layer 2 (src/runtime_profile.c).
# Copy to the port as port/profile.ini. Core defaults < this file < launcher/player < environment.
# Values mirror tlg_pc's launcher defaults (port/launcher/tlg_run.py DEFAULT_ENV).
tsc = auto              # host | process | auto (642 rdtsc in the eboot -> host, as today)
readbacks = 2           # the game reads GPU compute results on the CPU (AsyncMap)
eager_readback = 0      # not measured on TLG yet (KNOWN_ISSUES #16)
write_merge = 0
gc_budget_mb = 5600     # texture cache budget for 6 GB of VRAM
block1d = 0
pipeline_binaries = 0   # VK_KHR_pipeline_binary crashes on the NVIDIA 595 driver
# Mouse buttons: the core's built-in layout is TLG's (left Triangle grab, right R1 call Trico,
# middle Square), so nothing to set here.
# mouse_buttons = Mouse Left=triangle,Mouse Right=r1,Mouse Middle=square
