# Gravity Rush 2 (CUSA03694): game profile, layer 2 (src/runtime_profile.c).
# Copy to the port as port/profile.ini. Core defaults < this file < launcher/player < environment.
# Values mirror gr2_pc's launcher defaults (port/launcher/gr2_run.py).
tsc = auto              # 453 rdtsc in the eboot -> host, as today
readbacks = 2           # the game reads GPU compute results on the CPU (AsyncMap)
eager_readback = 0      # not measured on GR2 yet (KNOWN_ISSUES #16)
write_merge = 0
gc_budget_mb = 5600
block1d = 0
skip_adjacency = 1      # the comic outline pass draws black streaks (docs/BUG_LINHAS_PRETAS.md)
pipeline_binaries = 0   # VK_KHR_pipeline_binary crashes on the NVIDIA 595 driver
# Mouse buttons: still TLG's layout; set GR2's here when it has one (#4), e.g.
# mouse_buttons = Mouse Left=square,Mouse Right=r1,Mouse Middle=triangle
