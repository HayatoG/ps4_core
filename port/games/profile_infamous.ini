# inFAMOUS Second Son (CUSA00223 1.07): game profile, layer 2 (src/runtime_profile.c).
# Copy to the port as port/profile.ini. Core defaults < this file < launcher/player < environment
# (ISS_X is aliased to TLG_X before the profile is read, so ISS_READBACKS=0 still wins).
# Values mirror infamous_pc's launcher defaults (port/launcher/infamous_run.py).
tsc = auto              # 391 rdtsc in the eboot: must be host, or the game runs 3-4x fast
readbacks = 2           # precise: GPU particles (smoke to drain) need it
eager_readback = 1      # copy GPU results the game reads back at each fence
write_merge = 1         # game memcpy/memset into GPU memory without a GPU wait
gc_budget_mb = 3500     # 5600 runs out of VRAM loading the first level (RTX 2060, 6 GB)
block1d = 0             # the 2D promotion stripes the HUD (minimap)
pipeline_binaries = 0   # VK_KHR_pipeline_binary crashes on the NVIDIA 595 driver
# Mouse buttons: still TLG's layout (left Triangle, right R1, middle Square).
# mouse_buttons = Mouse Left=r2,Mouse Right=l2,Mouse Middle=triangle
